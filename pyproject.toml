[project]
name = "sec-10k-extractor"
version = "0.1.0"
description = "Item-level structured extraction from SEC 10-K filings (rules + LLM + XBRL hybrid)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Kevin Wei", email = "weisl@nlg.csie.ntu.edu.tw"}]

dependencies = [
  "edgartools>=5.30",
  "lxml>=5.3",
  "openai>=1.50",
  "httpx>=0.27",
  "tenacity>=8.5",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers/extractor", "src/shared"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
